apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-private
  namespace: flux-system
spec:
  interval: 10m
  url: ssh://git@github.com/giovanisilqueirasantos/homelab-private
  ref:
    branch: main
  # Deploy key created out-of-band with `flux create secret git`; never committed
  secretRef:
    name: homelab-private-deploy-key
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: private
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-private
  dependsOn:
    - name: infrastructure-prod
  path: ./
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
